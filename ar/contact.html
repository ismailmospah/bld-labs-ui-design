<main id="top" class="cpage">
  <div class="cpage__inner">

    <!-- Header -->
    <div class="cpage__head">
      <p class="section__tag">// ابدأ مشروعك</p>
      <h1 class="cpage__title">أخبرنا<br>عن <span class="rm__accent">مشروعك<i class="dot"></i></span></h1>
      <p class="cpage__lead">سنرد عليك خلال أقل من 8 ساعات.</p>
    </div>

    <!-- Form -->
    <div class="cform__wrap">
      <div class="cform__bar">
        <i></i><i></i><i></i>
        <span class="ltr">/bld/start-a-project</span>
      </div>

      <form class="cform" id="cform" novalidate>
        <div class="cform__error" id="cformError" style="display:none"></div>

        <div class="cform__row">
          <label>الاسم الكامل <em>*</em><input type="text" name="from_name" required placeholder="اسمك"></label>
          <label>واتساب <em>*</em><input type="tel" name="whatsapp_number" required placeholder="+20 100 000 0000" dir="ltr"></label>
        </div>
        <div class="cform__row">
          <label>الدولة <em>*</em>
            <select name="country" id="cfCountry" required>
              <option value="" disabled selected>اختر الدولة…</option>
              <option value="Egypt">مصر</option>
              <option value="Saudi Arabia">السعودية</option>
              <option value="UAE">الإمارات</option>
              <option value="Kuwait">الكويت</option>
              <option value="Qatar">قطر</option>
              <option value="Bahrain">البحرين</option>
              <option value="Oman">عُمان</option>
              <option value="Jordan">الأردن</option>
              <option value="other">أخرى</option>
            </select>
          </label>
          <label>الشركة <em>*</em><input type="text" name="company_name" required placeholder="اسم شركتك"></label>
        </div>

        <label id="cfOtherCountryWrap" style="display:none">حدّد الدولة <em>*</em><input type="text" name="country_other" id="cfOtherCountry" placeholder="يرجى التحديد"></label>

        <label>الخدمة <em>*</em>
          <select name="service" id="cfService" required>
            <option value="" disabled selected>اختر خدمة…</option>
            <option value="Product Design">تصميم المنتج</option>
            <option value="UX Research">بحث تجربة المستخدم</option>
            <option value="UI Design">تصميم الواجهات</option>
            <option value="Development">التطوير</option>
            <option value="other">أخرى</option>
          </select>
        </label>
        <label id="cfOtherServiceWrap" style="display:none">صف الخدمة <em>*</em><input type="text" name="service_other" id="cfOtherService" placeholder="ما الذي تحتاجه؟"></label>

        <div class="cform__row">
          <label>الميزانية <em>*</em><input type="text" name="budget" required placeholder="مثال: 2,000–5,000 دولار"></label>
          <label>المجال <em>*</em><input type="text" name="industry" required placeholder="مثال: الرعاية الصحية"></label>
        </div>
        <label>تفاصيل المشروع <em>*</em><textarea name="message" rows="5" required placeholder="صف مشروعك وأهدافك والجدول الزمني باختصار…"></textarea></label>

        <button type="submit" class="btn btn--solid cform__submit" id="cformBtn" data-hover data-magnetic>أرسل التفاصيل ←</button>
      </form>
